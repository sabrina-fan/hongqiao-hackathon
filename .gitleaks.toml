title = "NextStop secret scanning"

[extend]
useDefault = true

# Local dir scans exclude real env files; secrets:check-env separately rejects
# any tracked real env file, even one added with git add -f.
[allowlist]
paths = [
  '''(^|/)\.env($|\.)''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)data/''',
  '''(^|/)\.git/''',
  '''(^|/)test-results/'''
]
