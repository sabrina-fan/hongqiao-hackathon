title = "NextStop secret scanning"

[extend]
useDefault = true

# Local dir scans exclude only these known private env files. The committable
# .env.example is scanned; secrets:check-env rejects tracked private env files.
[allowlist]
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.env\.jev\.local$''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)data/''',
  '''(^|/)\.git/''',
  '''(^|/)test-results/'''
]
